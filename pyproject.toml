[project]
name = "polyagent"
version = "0.1.0"
description = "Drive locally installed coding-agent CLIs (codex, copilot, claude) through herdr from Python."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real herdr binary and agent CLIs (set POLYAGENT_INTEGRATION=1)"]
